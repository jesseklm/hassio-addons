name: LAN Radar
version: 0.0.4
slug: lan-radar
description: Discover and identify devices on the local network.
arch:
  - amd64
  - aarch64
url: https://github.com/jesseklm/lan-radar/
image: ghcr.io/jesseklm/lan-radar
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:radar
panel_title: LAN Radar
panel_admin: true
host_network: true
privileged:
  - NET_RAW
environment:
  HOME_ASSISTANT_INGRESS: "true"
